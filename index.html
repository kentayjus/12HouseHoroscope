                      ${clickable ? `<span class="daily-notice-cue">${isActiveFilter ? "Filtered ✓" : "Focus →"}</span>` : ""}
                    </li>
                  `;
                })
                .join("")}
            </ul>
          </div>

          <div class="daily-synthesis-footer">
            Tap any notice to filter the calendar, or pick a house card below for details.
          </div>
        </section>
      `;
    }

    function setHoverPreview(preview) {
      state.hoverPreview = preview;
      renderCalendar(getRotatedHouses());
    }

    function clearHoverPreview() {
      if (!state.hoverPreview) return;
      state.hoverPreview = null;
      renderCalendar(getRotatedHouses());
    }

    function populateSignSelects() {
      const sunSel = document.getElementById("sunSignSelect");
      const moonSel = document.getElementById("moonSignSelect");
      const ascSel = document.getElementById("ascendantSignSelect");

      const signOptionsHtml = SIGN_CYCLES_DATA.map(
        (s) => `<option value="${s.sign}">${s.sign}</option>`
      ).join("");

      const optionalSignOptionsHtml =
        `<option value="">— Select —</option>` + signOptionsHtml;

      sunSel.innerHTML = optionalSignOptionsHtml;
      moonSel.innerHTML = optionalSignOptionsHtml;
      ascSel.innerHTML = signOptionsHtml;

      syncControlsFromProfile();
    }

    function syncControlsFromProfile() {
      document.getElementById("sunSignSelect").value = state.profile.sunSign || "";
      document.getElementById("moonSignSelect").value = state.profile.moonSign || "";
      document.getElementById("ascendantSignSelect").value = state.profile.ascendantSign || "Aries";
      document.getElementById("saveLocalToggle").checked = Boolean(state.profile.saveLocal);

      const parts = [
        state.profile.sunSign ? `Sun in ${state.profile.sunSign}` : null,
        state.profile.moonSign ? `Moon in ${state.profile.moonSign}` : null,
        `Ascendant in ${state.profile.ascendantSign}`
      ].filter(Boolean);

      document.getElementById("chartSummaryLine").textContent =
        `${parts.join(" • ")} • Today: Sun, ${formatShortMMDDYYYY(TODAY_ISO)}`;
    }

    function renderPhaseLegendButtons() {
      document.querySelectorAll(".phase-legend-btn[data-phase]").forEach((btn) => {
        const code = btn.getAttribute("data-phase");
        const isActive = state.selectedPhaseCodes.includes(code);
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      const legendMoonBtn = document.getElementById("legendMoonBtn");
      if (legendMoonBtn) {
        legendMoonBtn.classList.toggle("active", state.moonOnlyFilter);
        legendMoonBtn.setAttribute("aria-pressed", String(state.moonOnlyFilter));
      }
    }

    function phaseBadgeHtml(code) {
      const cls =
        code === "S"
          ? "phase-s"
          : code === "E"
          ? "phase-e"
          : code === "P"
          ? "phase-p"
          : "phase-mc";
      const title =
        code === "S"
          ? "Starting"
          : code === "E"
          ? "Ending"
          : code === "P"
          ? "Peak"
          : "Mid-Cycle";
      return `<span class="phase-pill ${cls}" title="${title}">${code}</span>`;
    }

    function renderHousesGrid(houses) {
      const grid = document.getElementById("housesGrid");
      const countLabel = document.getElementById("selectionCountLabel");
      grid.innerHTML = "";

      countLabel.textContent =
        state.selectedHouseNums.length === 0
          ? "All 12 houses"
          : `${state.selectedHouseNums.length} selected`;

      for (const h of houses) {
        const isSelected = state.selectedHouseNums.includes(h.num);
        const activeCycles = h.cycles.filter((c) => isDateInRange(state.selectedDate, c.start, c.end));
        const hasActiveCycle = activeCycles.length > 0;
        const hasMajorActive = activeCycles.some((c) => c.tier === "major");
        const phaseCodes = getHousePhaseCodesForDate(h, state.selectedDate);
        const matchesPhase = houseMatchesSelectedPhases(h, state.selectedDate);
        const matchesMoon = !state.moonOnlyFilter || activeCycles.some((c) => Boolean(c.isMoonCycle));
        const isDithered =
          (state.selectedPhaseCodes.length > 0 && !matchesPhase) ||
          (state.moonOnlyFilter && !matchesMoon);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `house-tile ${isSelected ? "selected" : ""} ${
          hasActiveCycle ? "has-active-cycle" : "is-inactive-cycle"
        } ${hasMajorActive ? "has-major-active" : hasActiveCycle ? "has-minor-active" : ""} ${
          isDithered ? "is-dithered" : ""
        }`;
        btn.style.setProperty("--sign-color", h.color);
        btn.setAttribute("aria-pressed", String(isSelected));

        const indicatorHtml = hasActiveCycle
          ? `<span class="cycle-indicator-dot ${hasMajorActive ? "major-ring" : ""}"></span>`
          : "";

        btn.innerHTML = `
          <div class="house-tile-top">
            <span class="house-num-group">
              <span class="house-num">House ${h.num}</span>
              ${indicatorHtml}
              <span class="house-phase-badges">${phaseCodes.map(phaseBadgeHtml).join("")}</span>
            </span>
            <span class="sign-badge">${h.sign}</span>
          </div>
          <div class="house-meaning">${h.shortTheme}</div>
        `;

        btn.addEventListener("mouseover", () => {
          setHoverPreview({ type: "house", houseNums: [h.num] });
        });
        btn.addEventListener("mouseout", clearHoverPreview);

        btn.addEventListener("click", () => {
          if (state.selectedHouseNums.includes(h.num)) {
            state.selectedHouseNums = state.selectedHouseNums.filter((n) => n !== h.num);
          } else {
            state.selectedHouseNums = [...state.selectedHouseNums, h.num];
          }
          renderAll();
        });

        grid.appendChild(btn);
      }
    }

    function renderStandaloneMoonCardHtml(dateISO) {
      const lunar = getLunarCycleInfoForDate(dateISO);
      const markerNote = lunar.exactLunationLabel
        ? ` • Lunation marker: ${lunar.exactLunationLabel}`
        : "";
      const solsticeNote = dateISO === WINTER_SOLSTICE_ISO
        ? `<div class="moon-standalone-sub"><strong>Dec 21 Winter Solstice Significance:</strong> Reaches solstice at 2:50 PM CST (3:50 PM EST / 20:50 UTC)—the shortest day and longest night in the Northern Hemisphere, marking the Sun's southernmost turn and the gradual return of longer daylight.</div>`
        : "";
      return `
        <section class="moon-standalone-card" aria-label="Standalone Moon Cycle Overview">
          <div class="moon-standalone-header">
            <span>Moon Cycle Overview (General Lunar Phase)</span>
            <span class="moon-standalone-meta">Day ${lunar.cycleDay} of ~30 • ~${lunar.illuminationPct}% lit</span>
          </div>
          <div class="moon-standalone-phase-row">
            <span class="lunar-disc lunar-disc-lg ${lunar.discClass}" aria-hidden="true"></span>
            <span>${lunar.headline}${markerNote}</span>
          </div>
          <div class="moon-standalone-body">${lunar.summary}</div>
          <div class="moon-standalone-sub"><strong>General Pacing:</strong> ${lunar.pacing}</div>
          ${solsticeNote}
        </section>
      `;
    }

    function renderGuidanceCardHtml({ house, cycle, mid, isUpcoming, nextArea }) {
      const isExpanded = state.expandedCycleIds.has(cycle.id);
      const shadeClass = cycle.tier === "major" ? "shade-major" : "shade-minor";
      const midClass = mid ? "is-midcycle" : "";
      const upcomingClass = isUpcoming ? "is-upcoming" : "";

      const moonPrefix = cycle.isMoonCycle
        ? `<span class="moon-icon" aria-hidden="true">☾</span> `
        : cycle.isSolstice
        ? `<span style="color:#38bdf8;" aria-hidden="true">☀</span> `
        : "";
      const statusBadge = isUpcoming
        ? `UPCOMING (STARTS ${formatMonDay(cycle.start)}) • ${cycle.tier.toUpperCase()}`
        : cycle.isSolstice
        ? `SOLSTICE • SHORTEST DAY`
        : cycle.isMoonCycle
        ? cycle.isSupermoon
          ? `MOON CYCLE • SUPERMOON`
          : `MOON CYCLE`
        : `${cycle.tier.toUpperCase()}`;

      const natalNote = house.natalNote
        ? `<div class="guidance-natal-hook">Chart placement in House ${house.num} (${house.sign}): ${house.natalNote}</div>`
        : "";

      const moonPhaseName = inferMoonPhaseForCycle(cycle);
      const baseMoonPhaseGuidance = moonPhaseName ? MOON_PHASE_GUIDANCE[moonPhaseName] : null;
      const moonPhaseGuidanceText =
        moonPhaseName === "Full Moon" && cycle.isSupermoon
          ? `${baseMoonPhaseGuidance} ${cycle.label} is a Supermoon—expect heightened brightness, clearer visibility, and stronger pull around conversations, choices, and emotions.`
          : baseMoonPhaseGuidance;
      const houseAdviceText = HOUSE_MOON_ADVICE[house.num] || `Focus on practical choices around ${house.shortTheme.toLowerCase()}.`;
      const isNextAreaActive = state.nextAreaFilter && nextArea && state.nextAreaFilter.targetCycleId === nextArea.targetCycleId;

      const nextAreaRangeText = nextArea
        ? formatMonDayRange(nextArea.start, nextArea.end)
        : "";

      const nextAreaBtnHtml = nextArea
        ? `
          <button
            type="button"
            class="next-area-btn ${isNextAreaActive ? "is-active" : ""}"
            data-next-area-cycle-id="${cycle.id}"
            title="Highlight ${nextArea.label} (${nextAreaRangeText}) on calendar"
          >
            <span>Next Area: House ${nextArea.houseNum} (${nextArea.sign} • ${nextAreaRangeText}) →</span>
          </button>
        `
        : "";

      const moonPhaseHtml = moonPhaseGuidanceText
        ? `
          <div class="guidance-moon-phase-note">
            <div class="guidance-moon-phase-top">
              <span class="moon-icon" aria-hidden="true">☾</span>
              <div><strong>${moonPhaseName}${cycle.isSupermoon ? " (Supermoon)" : ""}:</strong> ${moonPhaseGuidanceText} ${houseAdviceText}</div>
            </div>
            ${nextAreaBtnHtml}
          </div>
        `
        : cycle.isMoonCycle
        ? `
          <div class="guidance-moon-phase-note">
            <div class="guidance-moon-phase-top">
              <span class="moon-icon" aria-hidden="true">☾</span>
              <div><strong>House ${house.num} Guidance:</strong> ${houseAdviceText}</div>
            </div>
            ${nextAreaBtnHtml}
          </div>
        `
        : "";

      return `
        <article
          class="guidance-card ${shadeClass} ${midClass} ${upcomingClass} ${isExpanded ? "is-expanded" : ""}"
          data-cycle-id="${cycle.id}"
          data-house-num="${house.num}"
          style="--house-color:${house.color}"
        >
          <div class="guidance-meta-row">
            <span class="guidance-house-tag">${moonPrefix}House ${house.num} ${house.sign} • ${statusBadge}</span>
            <span class="guidance-dates">${formatDateRange(cycle)}</span>
          </div>
          <div class="guidance-main-text">${cycle.guidance}</div>
          ${natalNote}
          <div class="guidance-expand-hint">
            <span>${cycle.label}</span>
            <span>${isExpanded ? "Hide details ▲" : "Details ▼"}</span>
          </div>
          ${
            isExpanded
              ? `
                <div class="guidance-extra-details">
                  <div><strong>${house.ordinal} (${house.sign}):</strong> ${house.description}</div>
                  <div class="guidance-cycle-meaning"><strong>Cycle Meaning:</strong> ${cycle.meaning}</div>
                  ${moonPhaseHtml}
                  <div><strong>Transit / Aspect:</strong> ${cycle.label} (${cycle.aspectType})</div>
                </div>
              `
              : ""
          }
        </article>
      `;
    }

    function renderLeftInfoPanel(houses) {
      const panel = document.getElementById("infoPanel");
      const grouped = getOrderedGuidanceEntries(houses);
      const isFiltered = state.selectedHouseNums.length > 0;
      const selectedMonDay = formatMonDay(state.selectedDate);

      const modeDescriptor = `Ascendant in ${state.profile.ascendantSign}`;

      const filtersParts = [];
      if (state.nextAreaFilter) filtersParts.push(`Next Area: ${state.nextAreaFilter.label}`);
      if (state.moonOnlyFilter) filtersParts.push("☾ Moon Cycles");
      if (state.selectedPhaseCodes.length > 0) filtersParts.push(`Phase: ${state.selectedPhaseCodes.join(", ")}`);
      const filterSuffix = filtersParts.length > 0 ? ` • ${filtersParts.join(" • ")}` : "";

      const subtitle = isFiltered
        ? `${modeDescriptor} • ${state.selectedHouseNums.map((n) => `House ${n}`).join(", ")}${filterSuffix}`
        : `${modeDescriptor}${filterSuffix} • Daily overview up top • Houses below`;

      const nextAreaBannerHtml = state.nextAreaFilter
        ? `
          <div class="next-area-filter-banner">
            <span>
              <strong>Next Area Highlighted:</strong> ${state.nextAreaFilter.label} (House ${state.nextAreaFilter.houseNum}, ${
                formatMonDayRange(state.nextAreaFilter.start, state.nextAreaFilter.end)
              })
            </span>
            <button type="button" class="btn btn-sm" id="btnClearNextArea">Show All</button>
          </div>
        `
        : "";

      const dailySynthesisHtml = !state.nextAreaFilter
        ? renderDailySynthesisCardHtml(houses, state.selectedDate)
        : "";

      const standaloneMoonHtml = state.moonOnlyFilter || state.selectedDate === WINTER_SOLSTICE_ISO
        ? renderStandaloneMoonCardHtml(state.selectedDate)
        : "";

      let feedHtml = "";

      if (grouped.all.length === 0) {
        feedHtml = `<div style="font-size:0.74rem; color:var(--text-muted); padding:10px 4px;">No house-specific cycles match this filter view on ${selectedMonDay}.</div>`;
      } else if (grouped.mode === "milestones" && !state.nextAreaFilter) {
        feedHtml += `
          <div class="guidance-section-divider">
            <div class="guidance-section-title">
              <span>Active / Starting or Ending on ${selectedMonDay}</span>
              <span>${grouped.currentOrToday.length}</span>
            </div>
            <div class="guidance-section-desc">Cycles starting, ending, or hitting a single-day peak on ${selectedMonDay}.</div>
          </div>
        `;

        if (grouped.currentOrToday.length > 0) {
          feedHtml += grouped.currentOrToday.map((item) => renderGuidanceCardHtml(item)).join("");
        } else {
          feedHtml += `<div style="font-size:0.71rem; color:var(--text-muted); padding:4px 4px;">No cycle starts, ends, or peaks on ${selectedMonDay}.</div>`;
        }

        if (grouped.upcoming.length > 0) {
          feedHtml += `
            <div class="guidance-section-divider upcoming">
              <div class="guidance-section-title">
                <span>Upcoming After ${selectedMonDay} (Not Yet Started)</span>
                <span>${grouped.upcoming.length}</span>
              </div>
              <div class="guidance-section-desc">Future cycles sorted by start date—not active yet on ${selectedMonDay}.</div>
            </div>
          `;
          feedHtml += grouped.upcoming.map((item) => renderGuidanceCardHtml(item)).join("");
        }
      } else {
        feedHtml = grouped.all.map((item) => renderGuidanceCardHtml(item)).join("");
      }

      panel.innerHTML = `
        <div class="info-header">
          <div>
            <div class="info-title">Guidance &amp; Dates</div>
            <div class="info-subtitle">${subtitle}</div>
          </div>
          <span class="selected-date-pill">${selectedMonDay}</span>
        </div>

        ${dailySynthesisHtml}

        <div class="cycle-filter-bar" role="group" aria-label="Cycle View Filters">
          <button class="btn btn-sm ${state.detailMode === "today" && !state.nextAreaFilter ? "active" : ""}" id="modeTodayFocus" type="button">Today's Focus</button>
          <button class="btn btn-sm ${state.detailMode === "milestones" && !state.nextAreaFilter ? "active" : ""}" id="modeMilestones" type="button">Start / End / Peak</button>
          <button class="btn btn-sm ${state.detailMode === "midcycle" && !state.nextAreaFilter ? "active" : ""}" id="modeMidCycle" type="button">Mid-Cycle</button>
          <button class="btn btn-sm moon-btn moon-filter-btn ${state.moonOnlyFilter ? "active" : ""}" id="filterMoonBtn" type="button" title="Toggle Moon cycles filter" aria-pressed="${String(state.moonOnlyFilter)}">
            <span class="moon-icon" aria-hidden="true">☾</span>
          </button>
        </div>

        ${nextAreaBannerHtml}
        ${standaloneMoonHtml}

        <div class="guidance-feed" id="guidanceFeed">${feedHtml}</div>
      `;

      panel.querySelectorAll(".daily-notice-item.is-clickable").forEach((el) => {
        const rawNums = (el.getAttribute("data-target-houses") || "")
          .split(",")
          .map((x) => Number(x.trim()))
          .filter((n) => Number.isInteger(n) && n >= 1 && n <= 12);
        if (rawNums.length === 0) return;

        el.addEventListener("click", (e) => {
          e.stopPropagation();
          handleNoticeClick(rawNums);
        });

        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            handleNoticeClick(rawNums);
          }
        });
      });

      document.getElementById("modeTodayFocus").addEventListener("click", () => {
        state.nextAreaFilter = null;
        state.detailMode = "today";
        renderAll();
      });
      document.getElementById("modeMilestones").addEventListener("click", () => {
        state.nextAreaFilter = null;
        state.detailMode = "milestones";
        renderAll();
      });
      document.getElementById("modeMidCycle").addEventListener("click", () => {
        state.nextAreaFilter = null;
        state.detailMode = "midcycle";
        renderAll();
      });
      document.getElementById("filterMoonBtn").addEventListener("click", toggleMoonFilter);

      const clearNextAreaBtn = document.getElementById("btnClearNextArea");
      if (clearNextAreaBtn) {
        clearNextAreaBtn.addEventListener("click", () => {
          state.nextAreaFilter = null;
          renderAll();
        });
      }

      const entriesMap = new Map(grouped.all.map((e) => [e.cycle.id, e]));

      panel.querySelectorAll(".next-area-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const sourceId = btn.getAttribute("data-next-area-cycle-id");
          const entry = entriesMap.get(sourceId);
          if (entry && entry.nextArea) {
            activateNextAreaFilter(entry.nextArea);
          }
        });
      });

      panel.querySelectorAll(".guidance-card").forEach((card) => {
        const cid = card.getAttribute("data-cycle-id");
        const entry = entriesMap.get(cid);
        if (!entry) return;

        card.addEventListener("mouseover", (e) => {
          e.stopPropagation();
          setHoverPreview({
            type: "cycle",
            houseNum: entry.house.num,
            cycle: entry.cycle
          });
        });

        card.addEventListener("mouseout", (e) => {
          if (!card.contains(e.relatedTarget)) {
            clearHoverPreview();
          }
        });

        card.addEventListener("click", () => {
          if (state.expandedCycleIds.has(cid)) {
            state.expandedCycleIds.delete(cid);
          } else {
            state.expandedCycleIds.add(cid);
          }
          renderLeftInfoPanel(houses);
        });
      });
    }

    function buildDayHighlightStyle(activeColors) {
      if (activeColors.length === 0) return "";
      if (activeColors.length === 1) {
        const c = activeColors[0];
        return `background: linear-gradient(135deg, color-mix(in srgb, ${c} 44%, #0f172a), color-mix(in srgb, ${c} 28%, #090d16)); border-color: color-mix(in srgb, ${c} 75%, transparent);`;
      }
      const step = 100 / activeColors.length;
      const stops = activeColors
        .map((c, idx) => {
          const from = (idx * step).toFixed(1);
          const to = ((idx + 1) * step).toFixed(1);
          return `color-mix(in srgb, ${c} 40%, #0e1525) ${from}%, color-mix(in srgb, ${c} 40%, #0e1525) ${to}%`;
        })
        .join(", ");
      return `background: linear-gradient(135deg, ${stops}); border-color: rgba(255, 255, 255, 0.28);`;
    }

    function renderCalendar(houses) {
      const monthLabel = document.getElementById("monthLabel");
      const daysGrid = document.getElementById("daysGrid");
      const selectedDateSummary = document.getElementById("selectedDateSummary");
      const previewBanner = document.getElementById("previewBanner");

      const monthDate = new Date(Date.UTC(state.viewYear, state.viewMonth, 1));
      monthLabel.textContent = monthDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });

      selectedDateSummary.textContent = formatReadableDate(state.selectedDate);

      const hover = state.hoverPreview;
      if (hover && hover.type === "cycle") {
        previewBanner.textContent = `Previewing: ${hover.cycle.label} (${formatDateRange(hover.cycle)})`;
        previewBanner.classList.add("active");
      } else if (hover && hover.type === "house") {
        const h = houses.find((x) => x.num === hover.houseNums[0]);
        previewBanner.textContent = `Previewing: House ${h.num} (${h.sign})`;
        previewBanner.classList.add("active");
      } else {
        previewBanner.textContent = "";
        previewBanner.classList.remove("active");
      }

      const firstWeekday = monthDate.getUTCDay();
      const daysInMonth = new Date(Date.UTC(state.viewYear, state.viewMonth + 1, 0)).getUTCDate();

      daysGrid.innerHTML = "";

      for (let i = 0; i < firstWeekday; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty";
        daysGrid.appendChild(empty);
      }

      const activeHouseFilter = hover && hover.type === "house"
        ? hover.houseNums
        : state.selectedHouseNums;
      const hasHouseSelection = activeHouseFilter.length > 0;

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = toISO(state.viewYear, state.viewMonth, d);
        const isToday = iso === TODAY_ISO;
        const isSelected = iso === state.selectedDate;
        const isSolstice = iso === WINTER_SOLSTICE_ISO;
        const isNextAreaDay =
          Boolean(state.nextAreaFilter) &&
          isDateInRange(iso, state.nextAreaFilter.start, state.nextAreaFilter.end);

        const lunar = getLunarCycleInfoForDate(iso);

        const dayMoonCycles = [];
        for (const h of houses) {
          for (const c of h.cycles) {
            if (c.isMoonCycle && isDateInRange(iso, c.start, c.end)) {
              dayMoonCycles.push({ house: h, cycle: c });
            }
          }
        }
        const hasMoonOnDay = dayMoonCycles.length > 0;

        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = `day-cell ${isToday ? "is-today" : ""} ${isSelected ? "is-selected" : ""} ${
          hasMoonOnDay ? "has-moon-cycle" : ""
        } ${isSolstice ? "is-solstice-day" : ""} ${isNextAreaDay ? "is-next-area-day" : ""}`;

        const swatchesByKey = new Map();
        const activeHouseColors = [];

        if (hover && hover.type === "cycle") {
          const h = houses.find((x) => x.num === hover.houseNum);
          if (h && isDateInRange(iso, hover.cycle.start, hover.cycle.end)) {
            const swatchColor = hover.cycle.color || h.color;
            swatchesByKey.set(`${h.num}-${swatchColor}-${hover.cycle.isMoonCycle ? "m" : "n"}`, {
              houseNum: h.num,
              color: swatchColor,
              isMoon: Boolean(hover.cycle.isMoonCycle),
              title: `House ${h.num} (${h.sign}): ${hover.cycle.label}`
            });
            activeHouseColors.push(h.color);
          }
        } else if (state.nextAreaFilter) {
          if (isNextAreaDay) {
            const targetHouse = houses.find((x) => x.num === state.nextAreaFilter.houseNum);
            if (targetHouse) {
              swatchesByKey.set(`${targetHouse.num}-${targetHouse.color}-next`, {
                houseNum: targetHouse.num,
                color: targetHouse.color,
                isMoon: true,
                title: `Next Area • House ${targetHouse.num} (${targetHouse.sign}): ${state.nextAreaFilter.label}`
              });
              activeHouseColors.push(targetHouse.color);
            }
          }
        } else {
          for (const h of houses) {
            if (hasHouseSelection && !activeHouseFilter.includes(h.num)) {
              continue;
            }
            if (!hasHouseSelection && !state.showAllSigns) {
              continue;
            }
            if (!hover && state.filterActiveOnDate) {
              const hasActiveOnSelected = h.cycles.some((c) => isDateInRange(state.selectedDate, c.start, c.end));
              if (!hasActiveOnSelected) continue;
            }

            let matchingCyclesOnDay = state.detailMode === "milestones"
              ? h.cycles.filter((c) => isMilestoneOnDate(c, iso))
              : getFilteredCyclesForHouse(h, iso);

            if (state.moonOnlyFilter) {
              matchingCyclesOnDay = matchingCyclesOnDay.filter((c) => Boolean(c.isMoonCycle));
            }

            if (state.selectedPhaseCodes.length > 0) {
              matchingCyclesOnDay = matchingCyclesOnDay.filter((c) =>
                cycleMatchesSelectedPhases(c, iso)
              );
            }

            if (matchingCyclesOnDay.length > 0) {
              const chosenCycle =
                state.moonOnlyFilter
                  ? matchingCyclesOnDay.find((c) => c.isMoonCycle) || matchingCyclesOnDay[0]
                  : matchingCyclesOnDay[0];
              const swatchColor = hasHouseSelection ? h.color : (chosenCycle.color || h.color);
              const isMoonSwatch = Boolean(chosenCycle.isMoonCycle);
              const key = `${h.num}-${swatchColor}-${isMoonSwatch ? "m" : "n"}`;
              if (!swatchesByKey.has(key)) {
                swatchesByKey.set(key, {
                  houseNum: h.num,
                  color: swatchColor,
                  isMoon: isMoonSwatch,
                  title: hasHouseSelection
                    ? `House ${h.num} (${h.sign})`
                    : `${isMoonSwatch ? "☾ " : ""}House ${h.num} (${h.sign}): ${chosenCycle.label}`
                });
              }
              if (state.moonOnlyFilter || hasHouseSelection) {
                activeHouseColors.push(h.color);
              }
            }
          }
        }

        const swatches = Array.from(swatchesByKey.values());

        if (activeHouseColors.length > 0) {
          cell.setAttribute("style", buildDayHighlightStyle(activeHouseColors));
        }

        const moonTooltipParts = [`${lunar.phaseName}${lunar.isSupermoon ? " (Supermoon)" : ""} (~${lunar.illuminationPct}% lit)`];
        if (hasMoonOnDay) {
          moonTooltipParts.push(dayMoonCycles.map((m) => `House ${m.house.num}: ${m.cycle.label}`).join(" • "));
        }
        if (isSolstice) {
          moonTooltipParts.push("Winter Solstice (Dec 21, 2026 • Shortest Day)");
        }
        const moonTitle = moonTooltipParts.join(" — ");

        cell.innerHTML = `
          <div class="day-top">
            <span class="day-num-wrap">
              <span class="day-num">${d}</span>
              <span class="lunar-disc ${lunar.discClass}" title="${moonTitle}" aria-label="${lunar.phaseName}"></span>
            </span>
            <span style="display:inline-flex; gap:3px; align-items:center;">
              ${isSolstice ? `<span class="solstice-tag" title="Winter Solstice">SOLSTICE</span>` : ""}
              ${isToday ? `<span class="today-tag">TODAY</span>` : ""}
            </span>
          </div>
          <div class="day-swatches">
            ${swatches
              .map(
                (s) =>
                  `<span class="color-swatch ${s.isMoon ? "is-moon-swatch" : ""}" style="--swatch-color:${s.color}" title="${s.title}">${s.houseNum}</span>`
              )
              .join("")}
          </div>
        `;

        cell.addEventListener("click", () => {
          state.selectedDate = iso;
          renderAll();
        });

        daysGrid.appendChild(cell);
      }
    }

    function renderToolbarStates() {
      const btnAllSigns = document.getElementById("btnAllSigns");
      const btnActiveToday = document.getElementById("btnActiveToday");

      btnAllSigns.classList.toggle(
        "active",
        state.showAllSigns &&
          state.selectedHouseNums.length === 0 &&
          state.selectedPhaseCodes.length === 0 &&
          !state.moonOnlyFilter &&
          !state.nextAreaFilter
      );
      btnActiveToday.classList.toggle("active", state.filterActiveOnDate);
    }

    function renderAll() {
      const houses = getRotatedHouses();
      syncControlsFromProfile();
      renderPhaseLegendButtons();
      renderToolbarStates();
      renderHousesGrid(houses);
      renderLeftInfoPanel(houses);
      renderCalendar(houses);
    }

    function toggleMoonFilter() {
      state.nextAreaFilter = null;
      state.moonOnlyFilter = !state.moonOnlyFilter;
      renderAll();
    }

    document.getElementById("legendMoonBtn").addEventListener("click", toggleMoonFilter);

    document.querySelectorAll(".phase-legend-btn[data-phase]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.nextAreaFilter = null;
        const code = btn.getAttribute("data-phase");
        if (state.selectedPhaseCodes.includes(code)) {
          state.selectedPhaseCodes = state.selectedPhaseCodes.filter((c) => c !== code);
        } else {
          state.selectedPhaseCodes = [...state.selectedPhaseCodes, code];
        }

        const hasSEP = state.selectedPhaseCodes.some((c) => c === "S" || c === "E" || c === "P");
        const hasMC = state.selectedPhaseCodes.includes("MC");

        if (hasSEP) {
          state.detailMode = "milestones";
        } else if (hasMC && !hasSEP) {
          state.detailMode = "midcycle";
        } else if (state.selectedPhaseCodes.length === 0) {
          state.detailMode = "today";
        }

        renderAll();
      });
    });

    function handleProfileChange() {
      state.profile = {
        sunSign: document.getElementById("sunSignSelect").value,
        moonSign: document.getElementById("moonSignSelect").value,
        ascendantSign: document.getElementById("ascendantSignSelect").value,
        saveLocal: document.getElementById("saveLocalToggle").checked
      };
      persistProfile(state.profile);
      renderAll();
    }

    document.getElementById("sunSignSelect").addEventListener("change", handleProfileChange);
    document.getElementById("moonSignSelect").addEventListener("change", handleProfileChange);
    document.getElementById("ascendantSignSelect").addEventListener("change", handleProfileChange);
    document.getElementById("saveLocalToggle").addEventListener("change", handleProfileChange);

    document.getElementById("btnResetSigns").addEventListener("click", () => {
      state.profile = { ...DEFAULT_PROFILE };
      persistProfile(state.profile);
      renderAll();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      state.viewMonth -= 1;
      if (state.viewMonth < 0) {
        state.viewMonth = 11;
        state.viewYear -= 1;
      }
      renderCalendar(getRotatedHouses());
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      state.viewMonth += 1;
      if (state.viewMonth > 11) {
        state.viewMonth = 0;
        state.viewYear += 1;
      }
      renderCalendar(getRotatedHouses());
    });

    document.getElementById("btnTodayJump").addEventListener("click", () => {
      state.nextAreaFilter = null;
      state.selectedDate = TODAY_ISO;
      state.viewYear = 2026;
      state.viewMonth = 10;
      renderAll();
    });

    document.getElementById("btnAllSigns").addEventListener("click", () => {
      state.selectedHouseNums = [];
      state.selectedPhaseCodes = [];
      state.moonOnlyFilter = false;
      state.nextAreaFilter = null;
      state.showAllSigns = true;
      renderAll();
    });

    document.getElementById("btnActiveToday").addEventListener("click", () => {
      state.filterActiveOnDate = !state.filterActiveOnDate;
      renderAll();
    });

    document.getElementById("btnClearSelection").addEventListener("click", () => {
      state.selectedHouseNums = [];
      state.selectedPhaseCodes = [];
      state.moonOnlyFilter = false;
      state.nextAreaFilter = null;
      renderAll();
    });

    document.getElementById("btnCopyCode").addEventListener("click", async () => {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      try {
        await navigator.clipboard.writeText(fullHtml);
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      } catch (err) {
        console.error("Clipboard copy failed:", err);
      }
    });

    populateSignSelects();
    persistProfile(state.profile);
    renderAll();
  </script>
</body>
</html>
