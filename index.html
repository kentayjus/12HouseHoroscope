<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12-House Cycle & Calendar Explorer</title>
  <style>
    :root {
      --bg-void: #070b14;
      --bg-panel: #0e1525;
      --bg-card: #131c31;
      --bg-card-hover: #192540;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(251, 191, 36, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --gold: #fbbf24;
      --gold-soft: rgba(251, 191, 36, 0.14);
      --moon-accent: #c084fc;
      --moon-soft: rgba(192, 132, 252, 0.16);
      --moon-border: rgba(192, 132, 252, 0.5);
      --solstice-accent: #38bdf8;
      --radius-lg: 12px;
      --radius-md: 9px;
      --radius-sm: 6px;
      --transition: 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at 15% 0%, #131f3a 0%, var(--bg-void) 55%);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.4;
      padding: 12px 16px 20px;
    }

    .app-shell {
      max-width: 1460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Top Bar with Integrated Sign Dropdown Controls */
    .topbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(14, 21, 37, 0.92);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
    }

    .topbar-header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand h1 {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .chart-summary-inline {
      font-size: 0.69rem;
      color: var(--text-secondary);
      text-align: right;
    }

    @media (max-width: 900px) {
      .chart-summary-inline {
        text-align: left;
      }
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: rgba(148, 163, 184, 0.35);
      transform: translateY(-1px);
    }

    .btn.active {
      background: var(--gold-soft);
      border-color: var(--border-strong);
      color: var(--gold);
    }

    .btn.moon-btn.active {
      background: var(--moon-soft);
      border-color: var(--moon-border);
      color: #e9d5ff;
    }

    .btn-sm {
      padding: 3px 6px;
      font-size: 0.67rem;
    }

    .moon-icon {
      display: inline-block;
      font-size: 0.76rem;
      line-height: 1;
      color: #d8b4fe;
    }

    /* Lunar Phase Disc Visuals */
    .lunar-disc {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
      border: 1px solid rgba(243, 232, 255, 0.7);
      box-shadow: 0 0 5px rgba(192, 132, 252, 0.45);
    }

    .lunar-disc-lg {
      width: 16px;
      height: 16px;
      border-width: 1.5px;
      box-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
    }

    .lunar-disc--new {
      background: #090d16;
      border-color: rgba(203, 213, 225, 0.75);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.9);
    }

    .lunar-disc--waxing-crescent {
      background: linear-gradient(90deg, #090d16 58%, #f8fafc 64%, #f8fafc 100%);
    }

    .lunar-disc--first-quarter {
      background: linear-gradient(90deg, #090d16 50%, #f8fafc 50%);
    }

    .lunar-disc--waxing-gibbous {
      background: linear-gradient(90deg, #090d16 18%, #f8fafc 26%, #f8fafc 100%);
    }

    .lunar-disc--full {
      background: #f8fafc;
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.85);
    }

    .lunar-disc--waning-gibbous {
      background: linear-gradient(90deg, #f8fafc 74%, #090d16 82%);
    }

    .lunar-disc--last-quarter {
      background: linear-gradient(90deg, #f8fafc 50%, #090d16 50%);
    }

    .lunar-disc--waning-crescent {
      background: linear-gradient(90deg, #f8fafc 36%, #090d16 42%);
    }

    /* Daily Synthesis & Animated Things to Take Notice Of Card */
    @keyframes noticePopIn {
      0% {
        opacity: 0;
        transform: translateY(5px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes noticeBadgeShimmer {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.25);
      }
      50% {
        box-shadow: 0 0 10px 1px rgba(251, 191, 36, 0.35);
      }
    }

    @keyframes moonNoticeShimmer {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.25);
      }
      50% {
        box-shadow: 0 0 10px 1px rgba(192, 132, 252, 0.38);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .daily-notice-item,
      .daily-notice-item.is-moon-notice,
      .house-tile,
      .cycle-indicator-dot,
      .guidance-card.is-midcycle {
        animation: none !important;
        transition: none !important;
      }
    }

    .daily-synthesis-card {
      background: linear-gradient(
        145deg,
        rgba(30, 41, 69, 0.88),
        rgba(13, 20, 36, 0.95)
      );
      border: 1px solid rgba(251, 191, 36, 0.34);
      border-left: 4px solid var(--gold);
      border-radius: var(--radius-md);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .daily-synthesis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .daily-synthesis-heading {
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gold);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .daily-synthesis-counts {
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .daily-synthesis-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .daily-synthesis-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .daily-theme-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .daily-theme-item {
      font-size: 0.72rem;
      color: #f8fafc;
      background: rgba(9, 14, 26, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      line-height: 1.36;
    }

    .daily-theme-item strong {
      color: #fde68a;
    }

    .daily-notice-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .daily-notice-item {
      font-size: 0.7rem;
      color: #fef9c3;
      background: linear-gradient(
        90deg,
        rgba(251, 191, 36, 0.16),
        rgba(15, 23, 42, 0.72) 75%
      );
      border: 1px solid rgba(251, 191, 36, 0.42);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      line-height: 1.35;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      animation: noticePopIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both,
        noticeBadgeShimmer 3.4s ease-in-out infinite;
    }

    .daily-notice-item.is-clickable {
      cursor: pointer;
      transition: transform var(--transition), filter var(--transition), border-color var(--transition);
    }

    .daily-notice-item.is-clickable:hover {
      transform: translateX(2px);
      filter: brightness(1.12);
      border-color: #fde047;
    }

    .daily-notice-item.is-active-filter {
      outline: 1.5px solid #ffffff;
      filter: brightness(1.15);
    }

    .daily-notice-item:nth-child(2) {
      animation-delay: 60ms, 500ms;
    }

    .daily-notice-item:nth-child(3) {
      animation-delay: 120ms, 1000ms;
    }

    .daily-notice-item:nth-child(4) {
      animation-delay: 180ms, 1500ms;
    }

    .daily-notice-item.is-moon-notice {
      color: #f3e8ff;
      background: linear-gradient(
        90deg,
        rgba(192, 132, 252, 0.2),
        rgba(24, 20, 54, 0.78) 75%
      );
      border-color: rgba(192, 132, 252, 0.52);
      border-left-color: #d8b4fe;
      animation: noticePopIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both,
        moonNoticeShimmer 3.6s ease-in-out infinite;
    }

    .daily-notice-left {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .daily-notice-spark {
      flex: 0 0 auto;
      font-size: 0.72rem;
      line-height: 1.25;
      color: var(--gold);
      font-weight: 800;
    }

    .daily-notice-item.is-moon-notice .daily-notice-spark {
      color: #e9d5ff;
    }

    .daily-notice-item strong {
      color: #ffffff;
    }

    .daily-notice-cue {
      flex: 0 0 auto;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fde68a;
      opacity: 0.85;
      white-space: nowrap;
      align-self: center;
    }

    .daily-notice-item.is-moon-notice .daily-notice-cue {
      color: #e9d5ff;
    }

    .daily-synthesis-footer {
      font-size: 0.63rem;
      color: var(--text-muted);
      padding-top: 3px;
      border-top: 1px dashed rgba(148, 163, 184, 0.18);
    }

    /* Standalone Moon Cycle Overview Card (not tied to a house) */
    .moon-standalone-card {
      background: linear-gradient(
        135deg,
        rgba(192, 132, 252, 0.18),
        rgba(30, 27, 75, 0.78)
      );
      border: 1px solid rgba(192, 132, 252, 0.5);
      border-left: 4px solid #c084fc;
      border-radius: var(--radius-md);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .moon-standalone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #f3e8ff;
    }

    .moon-standalone-phase-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
    }

    .moon-standalone-meta {
      font-size: 0.67rem;
      font-weight: 600;
      color: #e9d5ff;
    }

    .moon-standalone-body {
      font-size: 0.73rem;
      color: #f1f5f9;
      line-height: 1.42;
    }

    .moon-standalone-sub {
      font-size: 0.68rem;
      color: #ddd6fe;
      background: rgba(9, 14, 26, 0.45);
      border-radius: var(--radius-sm);
      padding: 5px 7px;
      line-height: 1.38;
    }

    /* Integrated Sign Dropdown Controls inside Topbar */
    .birth-controls-card {
      background: rgba(9, 14, 26, 0.72);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .birth-controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .birth-inputs-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .field-inline {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.71rem;
      color: var(--text-secondary);
    }

    .field-inline select {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 4px 7px;
      font-size: 0.72rem;
      font-family: inherit;
    }

    .field-inline select:focus {
      outline: none;
      border-color: var(--border-strong);
    }

    .calc-inline-link {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: var(--radius-sm);
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.32);
      transition: all var(--transition);
    }

    .calc-inline-link:hover {
      background: rgba(251, 191, 36, 0.18);
      border-color: var(--gold);
      text-decoration: underline;
    }

    .birth-controls-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-subtle);
      font-size: 0.68rem;
      color: var(--text-secondary);
    }

    .save-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Main ~1/3 Left (Details) & ~2/3 Right (12 Houses + Calendar) Split */
    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(340px, 1fr) minmax(0, 2fr);
      gap: 12px;
      align-items: start;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 1040px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Panel (~1/3): Guidance & Date Range Details */
    .info-panel {
      background: rgba(14, 21, 37, 0.92);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 150px);
      min-height: 520px;
      overflow-y: auto;
      scroll-margin-top: 16px;
    }

    .info-panel::-webkit-scrollbar {
      width: 6px;
    }

    .info-panel::-webkit-scrollbar-track {
      background: rgba(10, 15, 28, 0.5);
      border-radius: 999px;
    }

    .info-panel::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28);
      border-radius: 999px;
    }

    .info-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .info-title {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .info-subtitle {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .selected-date-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid var(--border-strong);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Filter bar with Today's Focus, Start / End / Peak, Mid-Cycle, and Moon icon */
    .cycle-filter-bar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
      gap: 4px;
      padding: 5px;
      background: rgba(9, 14, 26, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      align-items: center;
    }

    .cycle-filter-bar .btn {
      justify-content: center;
      padding: 4px 5px;
      font-size: 0.64rem;
    }

    .cycle-filter-bar .moon-filter-btn {
      padding: 4px 7px;
      font-size: 0.72rem;
    }

    .next-area-filter-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: rgba(192, 132, 252, 0.14);
      border: 1px solid rgba(192, 132, 252, 0.45);
      font-size: 0.68rem;
      color: #f3e8ff;
    }

    .guidance-feed {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .guidance-section-divider {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    .guidance-section-divider.upcoming {
      margin-top: 8px;
      background: rgba(30, 58, 138, 0.22);
      border-color: rgba(96, 165, 250, 0.38);
    }

    .guidance-section-title {
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guidance-section-divider.upcoming .guidance-section-title {
      color: #93c5fd;
    }

    .guidance-section-desc {
      font-size: 0.64rem;
      color: var(--text-secondary);
    }

    @keyframes midCycleFlow {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .guidance-card {
      --house-color: var(--gold);
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--house-color) 20%, #10192e),
        color-mix(in srgb, var(--house-color) 8%, #090e1c)
      );
      border: 1px solid color-mix(in srgb, var(--house-color) 42%, transparent);
      border-left: 4px solid var(--house-color);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .guidance-card.shade-major {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--house-color) 30%, #14203a),
        color-mix(in srgb, var(--house-color) 12%, #090e1c)
      );
      border-color: color-mix(in srgb, var(--house-color) 65%, #fbbf24 35%);
    }

    .guidance-card.shade-minor {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--house-color) 14%, #0f172a),
        color-mix(in srgb, var(--house-color) 5%, #080c16)
      );
      border-color: color-mix(in srgb, var(--house-color) 32%, rgba(148, 163, 184, 0.22));
    }

    .guidance-card.is-midcycle {
      background-size: 180% 180%;
      animation: midCycleFlow 6s ease-in-out infinite;
    }

    .guidance-card.is-upcoming {
      opacity: 0.85;
      border-style: dashed;
      border-left-style: solid;
    }

    .guidance-card:hover {
      transform: translateY(-1px);
      opacity: 1;
      border-color: color-mix(in srgb, var(--house-color) 85%, #ffffff 15%);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .guidance-card.is-expanded {
      opacity: 1;
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.35);
    }

    .guidance-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.66rem;
    }

    .guidance-house-tag {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: color-mix(in srgb, var(--house-color) 82%, #ffffff 18%);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .guidance-dates {
      font-weight: 700;
      color: color-mix(in srgb, var(--house-color) 75%, #f8fafc 25%);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .guidance-main-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.42;
    }

    .guidance-natal-hook {
      font-size: 0.68rem;
      color: #fde68a;
      background: rgba(251, 191, 36, 0.08);
      border-left: 2px solid rgba(251, 191, 36, 0.55);
      padding: 3px 6px;
      border-radius: 3px;
    }

    .guidance-expand-hint {
      font-size: 0.62rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guidance-extra-details {
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
      gap: 5px;

      padding: 7px 10px 7px 13px;

      transition: transform var(--transition), background var(--transition), border-color var(--transition), opacity var(--transition), filter var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      overflow: hidden;
      min-height: 54px;
    }

      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--sign-color, var(--gold));

      filter: grayscale(0.2) saturate(0.85);

    .house-tile.has-major-active {

        135deg,
        color-mix(in srgb, var(--sign-color) 30%, #15203b),

    .day-cell.is-next-area-day {
      box-shadow: 0 0 0 2px #e9d5ff, 0 0 12px rgba(192, 132, 252, 0.65);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
    }

    .day-num-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .day-num {
      font-size: 0.76rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);

    .today-tag {
      font-size: 0.54rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--gold);
      color: #090d16;

      font-size: 0.53rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.24);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.55);
    }

    .day-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
    }

    .color-swatch {
      width: 17px;
      height: 17px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-shadow:

      border: 1.5px solid #f3e8ff;
      box-shadow: 0 0 7px rgba(192, 132, 252, 0.72), 0 1px 4px rgba(0, 0, 0, 0.65);

      position: fixed;
      bottom: 14px;
      right: 14px;
      background: #1e293b;

      opacity: 1;
      transform: translateY(0);

    const SYNODIC_MONTH_DAYS = 29.530588;
    const REFERENCE_NEW_MOON_ISO = "2026-12-08";

    function isoToUtcDayNumber(isoStr) {
      const [y, m, d] = isoStr.split("-").map(Number);
      return Date.UTC(y, m - 1, d) / 86400000;
    }

    function getLunarCycleInfoForDate(isoStr) {
      const exactLunation = LUNATION_MARKERS.find((l) => l.date === isoStr);
      const refDay = isoToUtcDayNumber(REFERENCE_NEW_MOON_ISO);
      const curDay = isoToUtcDayNumber(isoStr);
      const rawAge = (curDay - refDay) % SYNODIC_MONTH_DAYS;
      const cycleAge = rawAge < 0 ? rawAge + SYNODIC_MONTH_DAYS : rawAge;
      const cycleFraction = cycleAge / SYNODIC_MONTH_DAYS;
      const illuminationPct = Math.round(((1 - Math.cos(cycleFraction * Math.PI * 2)) / 2) * 100);

      let phaseName = "Waxing Crescent";
      if (exactLunation) {
        phaseName = exactLunation.moonPhase;
      } else if (cycleAge < 1.0 || cycleAge > SYNODIC_MONTH_DAYS - 1.0) {
        phaseName = "New Moon";
      } else if (cycleAge < 6.5) {
        phaseName = "Waxing Crescent";
      } else if (cycleAge < 8.5) {
        phaseName = "First Quarter";
      } else if (cycleAge < 13.8) {
        phaseName = "Waxing Gibbous";
      } else if (cycleAge < 15.8) {
        phaseName = "Full Moon";
      } else if (cycleAge < 21.2) {
        phaseName = "Waning Gibbous";
      } else if (cycleAge < 23.2) {
        phaseName = "Last Quarter";
      } else {
        phaseName = "Waning Crescent";
      }

      const detail = STANDALONE_MOON_PHASE_DETAILS[phaseName] || STANDALONE_MOON_PHASE_DETAILS["Waxing Crescent"];
      const transitSeg = MOON_TRANSIT_SEGMENTS.find((seg) => isoStr >= seg.start && isoStr <= seg.end);
      const isSupermoon = Boolean(exactLunation && exactLunation.isSupermoon);

      return {
        phaseName,
        isSupermoon,
        discClass: detail.discClass,
        headline: isSupermoon ? `${detail.headline} • Supermoon` : detail.headline,
        pacing: isSupermoon
          ? `${detail.pacing} Supermoon note: slightly larger and brighter in the sky with extra emotional/mental pull—pace decisions deliberately.`
          : detail.pacing,
        summary: isSupermoon
          ? `${detail.summary} (${exactLunation.label} is a Supermoon.)`
          : detail.summary,
        cycleDay: Math.max(1, Math.min(30, Math.round(cycleAge) + 1)),
        illuminationPct,
        transitSign: transitSeg ? transitSeg.sign : null,
        exactLunationLabel: exactLunation ? exactLunation.label : null
      };
    }

    function inferMoonPhaseForCycle(cycle) {
      if (cycle.moonPhase) return cycle.moonPhase;
      const lower = (cycle.label || "").toLowerCase();
      if (lower.includes("new moon")) return "New Moon";
      if (lower.includes("first quarter")) return "First Quarter";
      if (lower.includes("full moon") || lower.includes("full supermoon") || lower.includes("beaver moon") || lower.includes("cold moon")) {
        return "Full Moon";
      }
      if (lower.includes("last quarter")) return "Last Quarter";
      return null;
    }

    function buildSignCyclesData() {
      return BASE_SIGN_CYCLES_DATA.map((s) => {
        const moonTransits = MOON_TRANSIT_SEGMENTS
          .filter((seg) => seg.sign === s.sign)
          .map((seg, idx) => ({
            id: `moon-${s.sign.toLowerCase()}-${seg.start}-${idx}`,
            tier: "minor",
            priority: 18 + idx,
            isMoonCycle: true,
            label: seg.label,
            aspectType: "Moon Transit",
            start: seg.start,
            end: seg.end,
            color: s.color,
            meaning: seg.meaning,
            guidance: seg.guidance
          }));

        const lunations = LUNATION_MARKERS
          .filter((lun) => lun.sign === s.sign)
          .map((lun) => ({
            id: lun.id,
            tier: "minor",
            priority: 9,
            isMoonCycle: true,
            isSupermoon: Boolean(lun.isSupermoon),
            moonPhase: lun.moonPhase,
            label: lun.label,
            aspectType: lun.aspectType,
            start: lun.date,
            end: lun.date,
            color: s.color,
            meaning: lun.meaning,
            guidance: lun.guidance
          }));

        return {
          ...s,
          cycles: [...s.cycles, ...lunations, ...moonTransits]
        };
      });
    }

    const SIGN_CYCLES_DATA = buildSignCyclesData();

    function loadSavedProfile() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_PROFILE };
        const parsed = JSON.parse(raw);
        return { ...DEFAULT_PROFILE, ...parsed };
      } catch (_) {
        return { ...DEFAULT_PROFILE };
      }
    }

    function persistProfile(profile) {
      if (!profile.saveLocal) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
      } catch (_) {}
    }

    const state = {
      profile: loadSavedProfile(),
      selectedHouseNums: [],
      selectedPhaseCodes: [], // "S" | "E" | "P" | "MC"
      moonOnlyFilter: false,
      nextAreaFilter: null, // { sourceCycleId, targetCycleId, houseNum, sign, start, end, label } | null
      selectedDate: TODAY_ISO,
      viewYear: 2026,
      viewMonth: 10, // November 2026
      showAllSigns: true,
      filterActiveOnDate: false,
      detailMode: "today", // "today" | "milestones" | "midcycle"
      expandedCycleIds: new Set(["lun-nov24", "cap-winter-solstice"]),
      hoverPreview: null
    };

    function getRotatedHouses() {
      const ascendantIdx = Math.max(
        0,
        SIGN_CYCLES_DATA.findIndex((s) => s.sign === state.profile.ascendantSign)
      );

      return HOUSE_THEMES.map((theme, i) => {
        const signObj = SIGN_CYCLES_DATA[(ascendantIdx + i) % 12];
        const placementNotes = [];

        if (state.profile.sunSign && state.profile.sunSign === signObj.sign) {
          placementNotes.push(`Sun in ${signObj.sign}`);
        }
        if (state.profile.moonSign && state.profile.moonSign === signObj.sign) {
          placementNotes.push(`Moon in ${signObj.sign}`);
        }

        return {
          num: theme.num,
          ordinal: theme.ordinal,
          sign: signObj.sign,
          color: signObj.color,
          shortTheme: theme.shortTheme,
          description: theme.description,
          natalNote: placementNotes.join(" • "),
          cycles: signObj.cycles
        };
      });
    }

    function findNextAreaForCycle(houses, currentHouse, currentCycle) {
      const allMoonChronological = [];
      for (const h of houses) {
        for (const c of h.cycles) {
          if (c.isMoonCycle) {
            allMoonChronological.push({ house: h, cycle: c });
          }
        }
      }

      allMoonChronological.sort((a, b) => {
        if (a.cycle.start !== b.cycle.start) return a.cycle.start.localeCompare(b.cycle.start);
        return a.cycle.end.localeCompare(b.cycle.end);
      });

      const currentIdx = allMoonChronological.findIndex((item) => item.cycle.id === currentCycle.id);
      if (currentIdx !== -1) {
        for (let i = currentIdx + 1; i < allMoonChronological.length; i++) {
          const candidate = allMoonChronological[i];
          if (
            candidate.cycle.id !== currentCycle.id &&
            (candidate.cycle.start > currentCycle.end ||
              (candidate.cycle.start >= currentCycle.start && candidate.cycle.label !== currentCycle.label))
          ) {
            return {
              sourceCycleId: currentCycle.id,
              targetCycleId: candidate.cycle.id,
              houseNum: candidate.house.num,
              sign: candidate.house.sign,
              start: candidate.cycle.start,
              end: candidate.cycle.end,
              label: candidate.cycle.label
            };
          }
        }
      }

      const sameHouseNext = currentHouse.cycles
        .filter((c) => c.id !== currentCycle.id && c.start > currentCycle.start)
        .sort((a, b) => a.start.localeCompare(b.start))[0];

      if (sameHouseNext) {
        return {
          sourceCycleId: currentCycle.id,
          targetCycleId: sameHouseNext.id,
          houseNum: currentHouse.num,
          sign: currentHouse.sign,
          start: sameHouseNext.start,
          end: sameHouseNext.end,
          label: sameHouseNext.label
        };
      }

      return null;
    }

    function activateNextAreaFilter(nextArea) {
      if (!nextArea) return;
      if (state.nextAreaFilter && state.nextAreaFilter.targetCycleId === nextArea.targetCycleId) {
        state.nextAreaFilter = null;
        renderAll();
        return;
      }

      state.nextAreaFilter = nextArea;
      state.selectedDate = nextArea.start;
      const [y, m] = nextArea.start.split("-").map(Number);
      state.viewYear = y;
      state.viewMonth = m - 1;
      state.expandedCycleIds.add(nextArea.targetCycleId);
      renderAll();
    }

    function toISO(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }

    function formatShortMMDDYYYY(isoStr) {
      if (!isoStr || !/^\d{4}-\d{2}-\d{2}$/.test(isoStr)) return "";
      const [y, m, d] = isoStr.split("-");
      return `${m}/${d}/${y}`;
    }

    const SHORT_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function formatMonDay(isoStr) {
      if (!isoStr || !/^\d{4}-\d{2}-\d{2}$/.test(isoStr)) return isoStr || "";
      const [, m, d] = isoStr.split("-").map(Number);
      return `${SHORT_MONTHS[m - 1]} ${d}`;
    }

    function formatMonDayRange(startISO, endISO) {
      if (startISO === endISO) return formatMonDay(startISO);
      return `${formatMonDay(startISO)} → ${formatMonDay(endISO)}`;
    }

    function formatReadableDate(isoStr) {
      const [y, m, d] = isoStr.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      return dt.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function formatDateRange(cycle) {
      return formatMonDayRange(cycle.start, cycle.end);
    }

    function isDateInRange(dateISO, startISO, endISO) {
      return dateISO >= startISO && dateISO <= endISO;
    }

    function isMidCycleOnDate(cycle, dateISO) {
      if (!isDateInRange(dateISO, cycle.start, cycle.end)) return false;
      if (cycle.start === cycle.end) return false;
      return dateISO > cycle.start && dateISO < cycle.end;
    }

    function isMilestoneOnDate(cycle, dateISO) {
      return dateISO === cycle.start || dateISO === cycle.end;
    }

    function isUpcomingCycle(cycle, dateISO) {
      return cycle.start > dateISO;
    }

    function getCyclePhaseCodesOnDate(cycle, dateISO) {
      const codes = new Set();
      if (!isDateInRange(dateISO, cycle.start, cycle.end)) return [];
      if (cycle.start === cycle.end && dateISO === cycle.start) {
        codes.add("P");
      } else {
        if (dateISO === cycle.start) codes.add("S");
        if (dateISO === cycle.end) codes.add("E");
        if (isMidCycleOnDate(cycle, dateISO)) codes.add("MC");
      }
      return ["S", "E", "P", "MC"].filter((k) => codes.has(k));
    }

    function getHousePhaseCodesForDate(house, dateISO) {
      const codes = new Set();
      for (const c of house.cycles) {
        for (const p of getCyclePhaseCodesOnDate(c, dateISO)) {
          codes.add(p);
        }
      }
      return ["S", "E", "P", "MC"].filter((k) => codes.has(k));
    }

    function houseMatchesSelectedPhases(house, dateISO) {
      if (state.selectedPhaseCodes.length === 0) return true;
      const codes = getHousePhaseCodesForDate(house, dateISO);
      return state.selectedPhaseCodes.some((p) => codes.includes(p));
    }

    function cycleMatchesSelectedPhases(cycle, dateISO) {
      if (state.selectedPhaseCodes.length === 0) return true;
      const codes = getCyclePhaseCodesOnDate(cycle, dateISO);
      return state.selectedPhaseCodes.some((p) => codes.includes(p));
    }

    function getFilteredCyclesForHouse(house, dateISO) {
      if (state.nextAreaFilter) {
        return house.cycles.filter((c) => c.id === state.nextAreaFilter.targetCycleId);
      }

      let list = [];
      if (state.detailMode === "today") {
        list = house.cycles.filter((c) => isDateInRange(dateISO, c.start, c.end));
      } else if (state.detailMode === "milestones") {
        list = house.cycles.filter(
          (c) => isMilestoneOnDate(c, dateISO) || isUpcomingCycle(c, dateISO)
        );
      } else if (state.detailMode === "midcycle") {
        list = house.cycles.filter((c) => isMidCycleOnDate(c, dateISO));
      }

      if (state.moonOnlyFilter) {
        list = list.filter((c) => Boolean(c.isMoonCycle));
      }

      if (state.selectedPhaseCodes.length > 0) {
        list = list.filter((c) => {
          if (isUpcomingCycle(c, dateISO)) return false;
          return cycleMatchesSelectedPhases(c, dateISO);
        });
      }

      return list;
    }

    function sortGuidanceEntries(entries) {
      return [...entries].sort((a, b) => {
        if (a.cycle.tier !== b.cycle.tier) {
          return a.cycle.tier === "major" ? -1 : 1;
        }
        return (a.cycle.priority ?? 99) - (b.cycle.priority ?? 99);
      });
    }

    function getOrderedGuidanceEntries(houses) {
      const filteredHouses =
        state.selectedHouseNums.length > 0
          ? houses.filter((h) => state.selectedHouseNums.includes(h.num))
          : houses;

      const entries = [];
      for (const h of filteredHouses) {
        const cycles = getFilteredCyclesForHouse(h, state.selectedDate);
        for (const c of cycles) {
          const isUpcoming = !state.nextAreaFilter && isUpcomingCycle(c, state.selectedDate);
          entries.push({
            house: h,
            cycle: c,
            mid: isMidCycleOnDate(c, state.selectedDate),
            isUpcoming,
            nextArea: findNextAreaForCycle(houses, h, c)
          });
        }
      }

      if (state.detailMode === "milestones" && !state.nextAreaFilter) {
        const currentOrToday = sortGuidanceEntries(entries.filter((e) => !e.isUpcoming));
        const upcoming = [...entries.filter((e) => e.isUpcoming)].sort((a, b) => {
          if (a.cycle.start !== b.cycle.start) {
            return a.cycle.start.localeCompare(b.cycle.start);
          }
          if (a.cycle.tier !== b.cycle.tier) {
            return a.cycle.tier === "major" ? -1 : 1;
          }
          return (a.cycle.priority ?? 99) - (b.cycle.priority ?? 99);
        });

        return {
          mode: "milestones",
          currentOrToday,
          upcoming,
          all: [...currentOrToday, ...upcoming]
        };
      }

      const sorted = sortGuidanceEntries(entries);
      return {
        mode: state.detailMode,
        currentOrToday: sorted,
        upcoming: [],
        all: sorted
      };
    }

    function formatUniqueHouseLabels(entries, maxItems = 2) {
      const seen = new Set();
      const labels = [];
      for (const e of entries) {
        const key = `${e.house.num}-${e.house.shortTheme.toLowerCase()}`;
        if (seen.has(key)) continue;
        seen.add(key);
        labels.push(`House ${e.house.num} (${e.house.shortTheme.toLowerCase()})`);
        if (labels.length >= maxItems) break;
      }
      return labels.join(" & ");
    }

    function formatUniqueHouseNums(entries, maxItems = 2) {
      const seen = new Set();
      const nums = [];
      for (const e of entries) {
        if (seen.has(e.house.num)) continue;
        seen.add(e.house.num);
        nums.push(`House ${e.house.num}`);
        if (nums.length >= maxItems) break;
      }
      return nums.join(" & ");
    }

    function collectUniqueHouseNums(entries, limit = 3) {
      const nums = [];
      for (const e of entries) {
        if (!nums.includes(e.house.num)) {
          nums.push(e.house.num);
        }
        if (nums.length >= limit) break;
      }
      return nums;
    }

    function scrollDetailsSlightlyIntoView() {
      const panel = document.getElementById("infoPanel");
      if (!panel) return;
      const rect = panel.getBoundingClientRect();
      if (rect.top < 12) {
        window.scrollBy({
          top: Math.max(-180, rect.top - 16),
          behavior: "smooth"
        });
      } else if (rect.top > 120) {
        window.scrollBy({
          top: Math.min(240, rect.top - 24),
          behavior: "smooth"
        });
      }
      panel.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleNoticeClick(targetHouseNums) {
      if (!Array.isArray(targetHouseNums) || targetHouseNums.length === 0) return;
      const sortedTarget = [...targetHouseNums].sort((a, b) => a - b);
      const sortedCurrent = [...state.selectedHouseNums].sort((a, b) => a - b);
      const alreadyMatched =
        sortedTarget.length === sortedCurrent.length &&
        sortedTarget.every((n, i) => n === sortedCurrent[i]);

      state.nextAreaFilter = null;
      state.selectedHouseNums = alreadyMatched ? [] : sortedTarget;
      renderAll();
      scrollDetailsSlightlyIntoView();
    }

    function buildDailySynthesis(houses, dateISO) {
      const scopedHouses =
        state.selectedHouseNums.length > 0
          ? houses.filter((h) => state.selectedHouseNums.includes(h.num))
          : houses;

      const activeEntries = [];
      for (const h of scopedHouses) {
        for (const c of h.cycles) {
          if (!isDateInRange(dateISO, c.start, c.end)) continue;
          if (state.moonOnlyFilter && !c.isMoonCycle) continue;
          if (state.selectedPhaseCodes.length > 0 && !cycleMatchesSelectedPhases(c, dateISO)) continue;
          activeEntries.push({
            house: h,
            cycle: c,
            phaseCodes: getCyclePhaseCodesOnDate(c, dateISO)
          });
        }
      }

      const majorEntries = sortGuidanceEntries(activeEntries.filter((e) => e.cycle.tier === "major"));
      const minorNonMoon = sortGuidanceEntries(
        activeEntries.filter((e) => e.cycle.tier !== "major" && !e.cycle.isMoonCycle)
      );
      const moonEntries = sortGuidanceEntries(
        activeEntries.filter((e) => Boolean(e.cycle.isMoonCycle))
      );
      const lunar = getLunarCycleInfoForDate(dateISO);

      const themes = [];

      if (majorEntries.length > 0) {
        const majorLabel = formatUniqueHouseLabels(majorEntries, 2);
        const leadMajor = majorEntries[0];
        themes.push(
          `<strong>${majorLabel}:</strong> ${leadMajor.cycle.guidance}`
        );
      }

      if (minorNonMoon.length > 0) {
        const minorLabel = formatUniqueHouseLabels(minorNonMoon, 2);
        const leadMinor = minorNonMoon[0];
        themes.push(
          `<strong>${minorLabel}:</strong> ${leadMinor.cycle.guidance}`
        );
      }

      if (moonEntries.length > 0) {
        const leadMoon = moonEntries[0];
        themes.push(
          `<strong>${lunar.phaseName}${lunar.isSupermoon ? " (Supermoon)" : ""} (${formatUniqueHouseNums(moonEntries, 1)}):</strong> ${leadMoon.cycle.guidance}`
        );
      } else if (themes.length === 0) {
        themes.push(
          `<strong>${lunar.phaseName}${lunar.isSupermoon ? " (Supermoon)" : ""}:</strong> ${lunar.pacing}`
        );
      }

      const notices = [];

      const milestoneEntries = activeEntries.filter((e) =>
        e.phaseCodes.some((p) => p === "S" || p === "E" || p === "P")
      );
      if (milestoneEntries.length > 0) {
        const hasEnding = milestoneEntries.some((e) => e.phaseCodes.includes("E"));
        const hasStarting = milestoneEntries.some((e) => e.phaseCodes.includes("S"));
        const milestoneGuidance = hasEnding && hasStarting
          ? "Wrap up loose ends you are finishing today and set clear intentions for what is just beginning."
          : hasEnding
          ? "Wrap up loose ends and tie off details on windows closing today."
          : "Take a clean first step on what is opening up today without overcomplicating it.";
        notices.push({
          isMoon: false,
          spark: "⚡",
          houseNums: collectUniqueHouseNums(milestoneEntries, 3),
          text: `<strong>Turning Point Today:</strong> ${milestoneGuidance}`
        });
      }

      const rxEntries = majorEntries.filter((e) =>
        /retrograde|shift forward|station/i.test(e.cycle.label) ||
        /retrograde|station/i.test(e.cycle.aspectType)
      );
      if (rxEntries.length > 0) {
        notices.push({
          isMoon: false,
          spark: "✦",
          houseNums: collectUniqueHouseNums(rxEntries, 3),
          text: `<strong>Pace Deliberately:</strong> Double-check details, test what holds up in practice, and avoid rushing big commitments.`
        });
      }

      notices.push({
        isMoon: true,
        spark: "☾",
        houseNums: collectUniqueHouseNums(moonEntries, 2),
        text: `<strong>${lunar.phaseName}${lunar.isSupermoon ? " • Supermoon" : ""} (~${lunar.illuminationPct}% lit):</strong> ${lunar.pacing}`
      });

      const natalActive = activeEntries.filter((e) => Boolean(e.house.natalNote));
      if (natalActive.length > 0) {
        notices.push({
          isMoon: false,
          spark: "★",
          houseNums: collectUniqueHouseNums(natalActive, 3),
          text: `<strong>Personal Resonance:</strong> Today's themes touch closer to home—lean into your natural instincts and pace.`
        });
      }

      return {
        dateLabel: formatMonDay(dateISO),
        majorCount: majorEntries.length,
        minorCount: minorNonMoon.length,
        moonCount: moonEntries.length,
        themes: themes.slice(0, 3),
        notices: notices.slice(0, 4)
      };
    }

      return `

                  const clickable = targetNums.length > 0;
                  return `
                    <li
                      class="daily-notice-item ${n.isMoon ? "is-moon-notice" : ""} ${
                        clickable ? "is-clickable" : ""
                      } ${isActiveFilter ? "is-active-filter" : ""}"
